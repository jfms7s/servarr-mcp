name: Build and push image

# `test` runs on every push and pull request; images are built only from main and v* tags.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: bash scripts/ci/needs-build.test.sh

  # Whether build-push has anything to build: a push to main that only touches Markdown runs the
  # tests but builds no image. Tags and manual runs always build.
  changes:
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/needs-build.sh >> "$GITHUB_OUTPUT"

  build-push:
    needs: [test, changes]
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    # The only job that may write packages: it logs in to GHCR and pushes the image.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Deploy target is an all-Raspberry-Pi (arm64) k3s cluster; amd64 is
      # kept too so the image still runs on a dev machine / other runners.
      # Pin deployments to the vX.Y.Z tag rather than `latest`: with
      # imagePullPolicy IfNotPresent a floating tag can't tell a node that
      # already cached an older build apart from one that hasn't.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/servarr-mcp:latest
            ghcr.io/${{ github.repository_owner }}/servarr-mcp:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/servarr-mcp:{1}', github.repository_owner, github.ref_name) || '' }}

  # eng-metrics-lab (report-only): duplication, complexity and dead code; the collector picks up the artifact.
  quality:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - name: Dead code (knip, eng-metrics-lab)
        run: mkdir -p .quality && npx --yes knip@5.88.1 --reporter json --no-exit-code > .quality/deadcode-ts.json
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true
