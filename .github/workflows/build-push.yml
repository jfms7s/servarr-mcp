name: Build and push image

# `test` runs on every push and pull request; images are built only from main and v* tags.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # Fails on a new high or critical advisory in the shipped (non-dev) dependency tree.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - name: Test with coverage (eng-metrics-lab)
        run: |
          npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcovonly --coverage.reportsDirectory="$RUNNER_TEMP/cov" '--coverage.include=src/**'
          mkdir -p .quality
          mv "$RUNNER_TEMP/cov/lcov.info" .quality/coverage-ts.lcov

      - run: npm run build

      # Starts dist/index.js: exit codes, /healthz, authenticated tools/list, SIGTERM.
      - run: npm run smoke

      - run: bash scripts/ci/needs-build.test.sh

      # Last step of the job: build-push needs test, so this report-only upload must never be able to block a deploy.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: coverage-fragments
          path: .quality/coverage-ts.lcov
          include-hidden-files: true
          retention-days: 7

  # Whether build-push has anything to build: a push to main that only touches Markdown runs the
  # tests but builds no image. Tags and manual runs always build.
  changes:
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/needs-build.sh >> "$GITHUB_OUTPUT"

  build-push:
    needs: [test, changes]
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    # The only job that may write packages: it logs in to GHCR and pushes the image.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kept: the Dockerfile's build stages run natively ($BUILDPLATFORM) and the arm64
      # runtime stage runs no RUN step, so QEMU should do no work -- it stays as a safety
      # net should a target-platform RUN step ever come back.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A native single-arch build, loaded locally and started before anything is pushed:
      # catches a broken CMD, a missing runtime file or a signal regression in the image itself.
      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: servarr-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: node scripts/smoke.mjs docker servarr-mcp:ci

      # Deploy target is an all-Raspberry-Pi (arm64) k3s cluster; amd64 is
      # kept too so the image still runs on a dev machine / other runners.
      # Pin deployments to the vX.Y.Z tag rather than `latest`: with
      # imagePullPolicy IfNotPresent a floating tag can't tell a node that
      # already cached an older build apart from one that hasn't.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/servarr-mcp:latest
            ghcr.io/${{ github.repository_owner }}/servarr-mcp:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/servarr-mcp:{1}', github.repository_owner, github.ref_name) || '' }}

  # eng-metrics-lab (report-only): duplication, complexity and dead code; the collector picks up the artifact.
  quality:
    needs: [test]
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - name: Dead code (knip, eng-metrics-lab)
        run: mkdir -p .quality && npx --yes knip@5.88.1 --reporter json --no-exit-code > .quality/deadcode-ts.json
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-fragments
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true
