# Keeps the SHA-pinned actions, the digest-pinned base image and npm dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
